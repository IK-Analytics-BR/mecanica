<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Expirado — IKFlow Mecânica</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body { background: #0b2447; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-exp { background: #fff; border-radius: 16px; padding: 48px 40px; text-align: center; max-width: 480px; }
    .icon-exp { font-size: 3.5rem; color: #dc3545; }
  </style>
</head>
<body>
  <div class="card-exp shadow-lg">
    <div class="icon-exp mb-3">⏰</div>
    <h4 class="fw-bold text-dark">Link expirado ou inválido</h4>
    <p class="text-muted mt-2">
      O link de acesso ao portal é válido por <strong>48 horas</strong>.<br>
      Solicite um novo link diretamente à oficina.
    </p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} mt-3">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <p class="mt-4 text-muted small">IKFlow Mecânica — Portal do Cliente</p>
  </div>
</body>
</html>
